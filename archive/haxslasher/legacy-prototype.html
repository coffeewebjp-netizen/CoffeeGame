<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Haxslasher Prototype</title>
  <style>
    :root {
      --bg: #07110f;
      --panel: #101713;
      --line: #2b4a3f;
      --text: #e8f4ed;
      --muted: #99b2aa;
      --accent: #76e7d2;
      --gold: #f0bf61;
      --danger: #ef6b66;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background:
        radial-gradient(circle at 22% 5%, #14382f 0%, transparent 32%),
        radial-gradient(circle at 84% 12%, #3b2811 0%, transparent 28%),
        linear-gradient(150deg, #060b0a 0%, var(--bg) 55%, #10110a 100%);
      color: var(--text);
      font-family: "Segoe UI", "Meiryo", sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    #shell {
      width: min(1180px, 100%);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 250px;
      gap: 12px;
      align-items: start;
    }

    #gamePanel,
    #runPanel {
      background: color-mix(in srgb, var(--panel) 94%, black);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 14px 42px #0009;
    }

    #gamePanel {
      padding: 10px;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 1px solid #2f594a;
      border-radius: 6px;
      background: #08110f;
    }

    #hud {
      min-height: 54px;
      margin-top: 8px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      font-size: 13px;
    }

    #stats,
    .mono {
      font-family: Consolas, Monaco, "Courier New", monospace;
    }

    #pad,
    .small {
      color: var(--muted);
      font-size: 12px;
    }

    #hint {
      grid-column: 1 / -1;
      color: #b8cbc4;
      font-size: 12px;
      line-height: 1.45;
    }

    #runPanel {
      min-height: 100%;
      padding: 12px;
    }

    #runPanel h1 {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 15px;
      font-weight: 700;
    }

    #build {
      display: grid;
      gap: 8px;
    }

    .relic {
      border-left: 2px solid var(--gold);
      padding: 6px 0 6px 8px;
      color: #f6e9cc;
      font-size: 12px;
      line-height: 1.35;
    }

    .empty {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 900px) {
      body {
        padding: 10px;
      }

      #shell {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="shell">
    <main id="gamePanel">
      <canvas id="game" width="960" height="540"></canvas>
      <div id="hud">
        <div id="stats" class="mono"></div>
        <div id="pad">Gamepad: not connected</div>
        <div id="hint">
          移動 WASD/矢印/左スティック、攻撃 F/Space/左クリック、回避 Shift、スキル Q/右クリック、リトライ Enter/R。
        </div>
      </div>
    </main>
    <aside id="runPanel">
      <h1>Run Relics</h1>
      <div id="build"></div>
    </aside>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const statsEl = document.getElementById('stats');
    const padEl = document.getElementById('pad');
    const buildEl = document.getElementById('build');

    const W = 960;
    const H = 540;
    const TAU = Math.PI * 2;

    const keys = new Set();
    const keyHeld = {};
    const queued = { attack: false, skill: false };
    const mouse = { x: W / 2, y: H / 2, inside: false };

    let activeGamepad = null;
    let prevAttackPressed = false;
    let prevDodgePressed = false;
    let prevSkillPressed = false;
    let prevStartPressed = false;

    const state = {
      score: 0,
      wave: 1,
      time: 0,
      running: true,
      spawnTimer: 0.2,
      bossSpawned: false,
      shake: 0,
      hitStop: 0,
      message: '知らない森。姉の声だけが、まだ遠くで聞こえる。',
      messageTimer: 5
    };

    const player = {
      x: W * 0.5,
      y: H * 0.56,
      r: 14,
      hp: 18,
      maxHp: 18,
      level: 1,
      energy: 0,
      nextEnergy: 100,
      speed: 220,
      power: 2,
      armor: 0,
      luck: 0,
      invuln: 0,
      attackCd: 0,
      combo: 0,
      comboTimer: 0,
      dodgeCd: 0,
      dodgeDur: 0,
      dodgeTime: 0.2,
      dodgeSpeed: 2.25,
      dodgeX: 0,
      dodgeY: 1,
      skillCd: 0,
      skillMax: 5.2,
      dirX: 0,
      dirY: 1,
      facing: -Math.PI / 2,
      relics: []
    };

    const enemies = [];
    const projectiles = [];
    const pickups = [];
    const slashes = [];
    const skillWaves = [];
    const particles = [];

    const scenery = [
      { x: 80, y: 105, w: 80, h: 34, kind: 'stone' },
      { x: 760, y: 88, w: 96, h: 38, kind: 'stone' },
      { x: 170, y: 430, w: 95, h: 30, kind: 'root' },
      { x: 650, y: 420, w: 128, h: 30, kind: 'root' },
      { x: 474, y: 130, w: 72, h: 26, kind: 'stone' },
      { x: 408, y: 476, w: 66, h: 24, kind: 'stone' }
    ];

    const ENEMY_TYPES = {
      skitter: {
        name: 'Skitter',
        hp: 3,
        speed: 132,
        r: 11,
        damage: 1,
        score: 35,
        energy: 18,
        color: '#cf5e68',
        behavior: 'chase'
      },
      brute: {
        name: 'Brute',
        hp: 9,
        speed: 70,
        r: 18,
        damage: 2,
        score: 85,
        energy: 34,
        color: '#c08a4d',
        behavior: 'brute'
      },
      wisp: {
        name: 'Wisp',
        hp: 5,
        speed: 92,
        r: 13,
        damage: 1,
        score: 65,
        energy: 26,
        color: '#70d1c5',
        behavior: 'ranged'
      },
      warden: {
        name: 'Warden',
        hp: 42,
        speed: 64,
        r: 30,
        damage: 2,
        score: 500,
        energy: 120,
        color: '#d5bf76',
        behavior: 'boss',
        boss: true
      }
    };

    const RELICS = [
      { name: '黒衣の縫い目', desc: '最大HP +3', effect: 'hp' },
      { name: '月青の刃片', desc: '攻撃力 +1', effect: 'power' },
      { name: '軽い足環', desc: '移動速度 +14', effect: 'speed' },
      { name: '琥珀の核', desc: 'スキル再使用 -0.45秒', effect: 'skill' },
      { name: '姉の糸飾り', desc: 'レリック出現率 +6%', effect: 'luck' },
      { name: '割れた護符', desc: '防御 +1', effect: 'armor' }
    ];

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function rand(min, max) {
      return min + Math.random() * (max - min);
    }

    function keyName(key) {
      return key.length === 1 ? key.toLowerCase() : key;
    }

    function angleDelta(a, b) {
      let d = a - b;
      while (d > Math.PI) d -= TAU;
      while (d < -Math.PI) d += TAU;
      return d;
    }

    function setMessage(text, seconds = 2.4) {
      state.message = text;
      state.messageTimer = seconds;
    }

    function addParticle(x, y, text, options = {}) {
      particles.push({
        x,
        y,
        text,
        t: options.t ?? 0.42,
        maxT: options.t ?? 0.42,
        vx: options.vx ?? rand(-24, 24),
        vy: options.vy ?? rand(-45, -14),
        color: options.color ?? '#fff7d6',
        size: options.size ?? 13
      });
    }

    function addSpark(x, y, color = '#baf7ed', count = 7) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x,
          y,
          text: '',
          t: rand(0.18, 0.38),
          maxT: 0.38,
          vx: rand(-95, 95),
          vy: rand(-95, 45),
          color,
          size: rand(2, 4),
          dot: true
        });
      }
    }

    function nearestEnemy(maxDistance = Infinity) {
      let best = null;
      let bestD = maxDistance;
      for (const e of enemies) {
        const d = Math.hypot(e.x - player.x, e.y - player.y);
        if (d < bestD) {
          bestD = d;
          best = e;
        }
      }
      return best;
    }

    function spawnEnemy(typeKey) {
      const def = ENEMY_TYPES[typeKey];
      const edge = Math.floor(Math.random() * 4);
      let x = 0;
      let y = 0;
      if (edge === 0) { x = rand(40, W - 40); y = -34; }
      if (edge === 1) { x = W + 34; y = rand(40, H - 40); }
      if (edge === 2) { x = rand(40, W - 40); y = H + 34; }
      if (edge === 3) { x = -34; y = rand(40, H - 40); }

      const hp = def.hp + Math.floor(state.wave * (def.boss ? 5 : 0.7));
      enemies.push({
        type: typeKey,
        name: def.name,
        x,
        y,
        r: def.r,
        hp,
        maxHp: hp,
        speed: def.speed + state.wave * (def.boss ? 2 : 4),
        damage: def.damage,
        score: def.score,
        energy: def.energy,
        color: def.color,
        behavior: def.behavior,
        boss: Boolean(def.boss),
        flash: 0,
        attackCd: rand(0.5, 1.7),
        windup: 0,
        lunge: 0,
        aimX: 0,
        aimY: 1
      });

      if (def.boss) setMessage('調律兵が現れた。世界がこちらを拒んでいる。', 4);
    }

    function chooseEnemyType() {
      const r = Math.random();
      if (state.wave >= 4 && r < 0.22) return 'wisp';
      if (state.wave >= 2 && r < 0.42) return 'brute';
      return 'skitter';
    }

    function chooseRelic() {
      return RELICS[Math.floor(Math.random() * RELICS.length)];
    }

    function spawnPickup(x, y, kind, relic = null) {
      pickups.push({
        x: x + rand(-8, 8),
        y: y + rand(-8, 8),
        r: kind === 'relic' ? 10 : 8,
        kind,
        relic,
        age: 0,
        pulse: rand(0, TAU)
      });
    }

    function applyRelic(relic) {
      player.relics.push(relic);
      if (relic.effect === 'hp') {
        player.maxHp += 3;
        player.hp = Math.min(player.maxHp, player.hp + 3);
      }
      if (relic.effect === 'power') player.power += 1;
      if (relic.effect === 'speed') player.speed += 14;
      if (relic.effect === 'skill') player.skillMax = Math.max(3, player.skillMax - 0.45);
      if (relic.effect === 'luck') player.luck += 0.06;
      if (relic.effect === 'armor') player.armor += 1;
      setMessage(`拾得: ${relic.name} / ${relic.desc}`, 3.2);
      state.shake = Math.max(state.shake, 5);
      updateBuildPanel();
    }

    function gainEnergy(amount) {
      player.energy += amount;
      while (player.energy >= player.nextEnergy) {
        player.energy -= player.nextEnergy;
        player.level += 1;
        player.nextEnergy = Math.floor(player.nextEnergy * 1.28 + 20);
        player.maxHp += 2;
        player.hp = player.maxHp;
        if (player.level % 2 === 0) player.power += 1;
        addParticle(player.x, player.y - 25, 'LEVEL UP', { color: '#f6d57a', size: 16, t: 0.7, vy: -28 });
        addSpark(player.x, player.y, '#f6d57a', 18);
        setMessage(`存在値が上がった。Lv ${player.level}`, 2.8);
      }
    }

    function damageEnemy(e, amount, knock = 16) {
      e.hp -= amount;
      e.flash = 0.12;
      const dx = e.x - player.x;
      const dy = e.y - player.y;
      const d = Math.hypot(dx, dy) || 1;
      e.x += (dx / d) * knock;
      e.y += (dy / d) * knock;
      addParticle(e.x, e.y - e.r, `-${amount}`, { color: '#ffffff', size: e.boss ? 16 : 13 });
      addSpark(e.x, e.y, e.boss ? '#f6d57a' : '#a6fff1', e.boss ? 12 : 6);
      state.shake = Math.max(state.shake, e.boss ? 8 : 4);
      state.hitStop = Math.max(state.hitStop, e.boss ? 0.055 : 0.035);
      if (e.hp <= 0) defeatEnemy(e);
    }

    function defeatEnemy(e) {
      state.score += e.score + state.wave * 8;
      gainEnergy(Math.floor(e.energy * 0.35));
      addSpark(e.x, e.y, e.color, e.boss ? 24 : 12);

      const dropChance = e.boss ? 1 : 0.14 + player.luck;
      if (Math.random() < 0.72 || e.boss) spawnPickup(e.x, e.y, 'energy');
      if (player.hp < player.maxHp && Math.random() < 0.32) spawnPickup(e.x, e.y, 'heal');
      if (Math.random() < dropChance) spawnPickup(e.x, e.y, 'relic', chooseRelic());

      const idx = enemies.indexOf(e);
      if (idx >= 0) enemies.splice(idx, 1);
    }

    function damagePlayer(amount, x, y) {
      if (player.invuln > 0 || !state.running) return;
      const reduced = Math.max(1, amount - Math.floor(player.armor / 3));
      player.hp = Math.max(0, player.hp - reduced);
      player.invuln = 0.72;
      state.shake = Math.max(state.shake, 9);
      addParticle(player.x, player.y - 20, `-${reduced}`, { color: '#ff817b', size: 16 });
      const dx = player.x - x;
      const dy = player.y - y;
      const d = Math.hypot(dx, dy) || 1;
      player.x = clamp(player.x + (dx / d) * 16, 18, W - 18);
      player.y = clamp(player.y + (dy / d) * 16, 18, H - 18);

      if (player.hp <= 0) {
        player.hp = 0;
        state.running = false;
        setMessage('GAME OVER: Enter / R / Start でリトライ', 999);
      }
    }

    function faceNearestEnemy() {
      const target = nearestEnemy(150);
      if (!target) return;
      player.facing = Math.atan2(target.y - player.y, target.x - player.x);
    }

    function doAttack() {
      if (player.attackCd > 0 || !state.running) return;
      faceNearestEnemy();

      player.combo = player.comboTimer > 0 ? (player.combo % 3) + 1 : 1;
      player.comboTimer = 0.58;
      const finisher = player.combo === 3;
      const range = finisher ? 86 : 66;
      const arc = finisher ? 0.95 : 0.68;
      const damage = player.power + (finisher ? 2 : 0);

      player.attackCd = finisher ? 0.42 : 0.28;
      slashes.push({
        x: player.x,
        y: player.y,
        dir: player.facing,
        range,
        arc,
        life: 0.16,
        maxLife: 0.16,
        combo: player.combo
      });

      let hit = false;
      for (const e of [...enemies]) {
        const dx = e.x - player.x;
        const dy = e.y - player.y;
        const dist = Math.hypot(dx, dy);
        if (dist > range + e.r) continue;
        const diff = Math.abs(angleDelta(Math.atan2(dy, dx), player.facing));
        if (diff > arc) continue;
        damageEnemy(e, damage, finisher ? 28 : 18);
        hit = true;
      }
      if (!hit) state.hitStop = Math.max(state.hitStop, 0.012);
    }

    function doSkill() {
      if (player.skillCd > 0 || !state.running) return;
      player.skillCd = player.skillMax;
      const radius = 118;
      const damage = player.power + 3;
      skillWaves.push({ x: player.x, y: player.y, r: 8, maxR: radius, life: 0.34, maxLife: 0.34 });
      for (const e of [...enemies]) {
        const d = Math.hypot(e.x - player.x, e.y - player.y);
        if (d <= radius + e.r) damageEnemy(e, damage, 34);
      }
      state.shake = Math.max(state.shake, 12);
      state.hitStop = Math.max(state.hitStop, 0.075);
      setMessage('虚閃。周囲の敵を断つ。', 1.8);
    }

    function doDodge(input) {
      if (player.dodgeCd > 0 || player.dodgeDur > 0 || !state.running) return;
      let dx = input.move.x;
      let dy = input.move.y;
      if (dx === 0 && dy === 0) {
        dx = Math.cos(player.facing);
        dy = Math.sin(player.facing);
      }
      player.dodgeX = dx;
      player.dodgeY = dy;
      player.dodgeDur = player.dodgeTime;
      player.dodgeCd = 0.9;
      player.invuln = 0.34;
      addSpark(player.x, player.y, '#76e7d2', 9);
    }

    function resetGame() {
      state.score = 0;
      state.wave = 1;
      state.time = 0;
      state.running = true;
      state.spawnTimer = 0.25;
      state.bossSpawned = false;
      state.shake = 0;
      state.hitStop = 0;
      state.message = '知らない森。姉の声だけが、まだ遠くで聞こえる。';
      state.messageTimer = 5;

      player.x = W * 0.5;
      player.y = H * 0.56;
      player.hp = 18;
      player.maxHp = 18;
      player.level = 1;
      player.energy = 0;
      player.nextEnergy = 100;
      player.speed = 220;
      player.power = 2;
      player.armor = 0;
      player.luck = 0;
      player.invuln = 0;
      player.attackCd = 0;
      player.combo = 0;
      player.comboTimer = 0;
      player.dodgeCd = 0;
      player.dodgeDur = 0;
      player.skillCd = 0;
      player.skillMax = 5.2;
      player.facing = -Math.PI / 2;
      player.dirX = 0;
      player.dirY = 1;
      player.relics = [];

      enemies.length = 0;
      projectiles.length = 0;
      pickups.length = 0;
      slashes.length = 0;
      skillWaves.length = 0;
      particles.length = 0;
      updateBuildPanel();
    }

    function getInput() {
      const move = { x: 0, y: 0 };
      if (keys.has('w') || keys.has('ArrowUp')) move.y -= 1;
      if (keys.has('s') || keys.has('ArrowDown')) move.y += 1;
      if (keys.has('a') || keys.has('ArrowLeft')) move.x -= 1;
      if (keys.has('d') || keys.has('ArrowRight')) move.x += 1;

      let attack = keyHeld.f || keyHeld[' '] || queued.attack;
      let dodge = keyHeld.Shift;
      let skill = keyHeld.q || queued.skill;
      let start = keyHeld.Enter || keyHeld.r;

      const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
      let gp = null;
      if (activeGamepad !== null && gamepads[activeGamepad]) gp = gamepads[activeGamepad];
      if (!gp) {
        for (let i = 0; i < gamepads.length; i++) {
          if (gamepads[i]) {
            gp = gamepads[i];
            activeGamepad = i;
            break;
          }
        }
      }

      if (gp && gp.axes) {
        const ax = gp.axes[0] || 0;
        const ay = gp.axes[1] || 0;
        const dead = 0.16;
        if (Math.abs(ax) > dead) move.x += ax;
        if (Math.abs(ay) > dead) move.y += ay;
        if (gp.buttons[14]?.pressed) move.x -= 1;
        if (gp.buttons[15]?.pressed) move.x += 1;
        if (gp.buttons[12]?.pressed) move.y -= 1;
        if (gp.buttons[13]?.pressed) move.y += 1;

        attack = attack || gp.buttons[0]?.pressed || gp.buttons[7]?.pressed;
        dodge = dodge || gp.buttons[1]?.pressed || gp.buttons[5]?.pressed;
        skill = skill || gp.buttons[2]?.pressed || gp.buttons[6]?.pressed;
        start = start || gp.buttons[9]?.pressed;

        const rx = gp.axes[2] || 0;
        const ry = gp.axes[3] || 0;
        if (Math.hypot(rx, ry) > 0.25) player.facing = Math.atan2(ry, rx);
      }

      if (move.x !== 0 || move.y !== 0) {
        const len = Math.hypot(move.x, move.y);
        move.x /= len;
        move.y /= len;
        player.dirX = move.x;
        player.dirY = move.y;
        player.facing = Math.atan2(move.y, move.x);
      } else if (mouse.inside) {
        const dx = mouse.x - player.x;
        const dy = mouse.y - player.y;
        if (Math.hypot(dx, dy) > 16) player.facing = Math.atan2(dy, dx);
      }

      const input = {
        move,
        attackEdge: attack && !prevAttackPressed,
        dodgeEdge: dodge && !prevDodgePressed,
        skillEdge: skill && !prevSkillPressed,
        startEdge: start && !prevStartPressed
      };

      prevAttackPressed = attack;
      prevDodgePressed = dodge;
      prevSkillPressed = skill;
      prevStartPressed = start;
      queued.attack = false;
      queued.skill = false;
      return input;
    }

    function updatePlayer(dt, input) {
      if (input.attackEdge) doAttack();
      if (input.skillEdge) doSkill();
      if (input.dodgeEdge) doDodge(input);

      player.attackCd = Math.max(0, player.attackCd - dt);
      player.comboTimer = Math.max(0, player.comboTimer - dt);
      player.dodgeCd = Math.max(0, player.dodgeCd - dt);
      player.dodgeDur = Math.max(0, player.dodgeDur - dt);
      player.invuln = Math.max(0, player.invuln - dt);
      player.skillCd = Math.max(0, player.skillCd - dt);

      let dx = input.move.x;
      let dy = input.move.y;
      let speed = player.speed;
      if (player.dodgeDur > 0) {
        dx = player.dodgeX;
        dy = player.dodgeY;
        speed *= player.dodgeSpeed;
      }

      player.x = clamp(player.x + dx * speed * dt, 18, W - 18);
      player.y = clamp(player.y + dy * speed * dt, 22, H - 18);
    }

    function updateSpawning(dt) {
      state.wave = 1 + Math.floor(state.time / 20) + Math.floor(state.score / 1400);
      const maxEnemies = Math.min(28, 9 + state.wave * 3);
      state.spawnTimer -= dt;
      if (state.spawnTimer <= 0 && enemies.length < maxEnemies) {
        spawnEnemy(chooseEnemyType());
        state.spawnTimer = Math.max(0.34, 1.24 - state.wave * 0.07);
      }
      if (!state.bossSpawned && state.time > 50) {
        state.bossSpawned = true;
        spawnEnemy('warden');
      }
    }

    function updateEnemies(dt) {
      for (const e of [...enemies]) {
        e.flash = Math.max(0, e.flash - dt);
        e.attackCd = Math.max(0, e.attackCd - dt);

        const dx = player.x - e.x;
        const dy = player.y - e.y;
        const d = Math.hypot(dx, dy) || 1;
        const nx = dx / d;
        const ny = dy / d;

        if (e.behavior === 'chase') {
          e.x += nx * e.speed * dt;
          e.y += ny * e.speed * dt;
        }

        if (e.behavior === 'brute') {
          if (e.windup > 0) {
            e.windup -= dt;
            if (e.windup <= 0) e.lunge = 0.28;
          } else if (e.lunge > 0) {
            e.lunge -= dt;
            e.x += e.aimX * 360 * dt;
            e.y += e.aimY * 360 * dt;
          } else if (d < 145 && e.attackCd <= 0) {
            e.windup = 0.5;
            e.attackCd = 2.2;
            e.aimX = nx;
            e.aimY = ny;
          } else {
            e.x += nx * e.speed * dt;
            e.y += ny * e.speed * dt;
          }
        }

        if (e.behavior === 'ranged') {
          const preferred = 168;
          if (d > preferred + 34) {
            e.x += nx * e.speed * dt;
            e.y += ny * e.speed * dt;
          } else if (d < preferred - 34) {
            e.x -= nx * e.speed * 0.9 * dt;
            e.y -= ny * e.speed * 0.9 * dt;
          }
          if (e.attackCd <= 0) {
            e.attackCd = rand(1.3, 2.1);
            projectiles.push({
              x: e.x,
              y: e.y,
              vx: nx * 190,
              vy: ny * 190,
              r: 5,
              life: 4,
              damage: e.damage,
              color: '#7fe3d4'
            });
          }
        }

        if (e.behavior === 'boss') {
          if (d > 175) {
            e.x += nx * e.speed * dt;
            e.y += ny * e.speed * dt;
          }
          if (e.attackCd <= 0) {
            e.attackCd = 1.75;
            for (let i = -1; i <= 1; i++) {
              const ang = Math.atan2(ny, nx) + i * 0.22;
              projectiles.push({
                x: e.x + Math.cos(ang) * e.r,
                y: e.y + Math.sin(ang) * e.r,
                vx: Math.cos(ang) * 210,
                vy: Math.sin(ang) * 210,
                r: 6,
                life: 4,
                damage: e.damage,
                color: '#f6d57a'
              });
            }
          }
        }

        e.x = clamp(e.x, -60, W + 60);
        e.y = clamp(e.y, -60, H + 60);

        const touching = Math.hypot(player.x - e.x, player.y - e.y) < player.r + e.r - 2;
        if (touching) damagePlayer(e.damage, e.x, e.y);
      }
    }

    function updateProjectiles(dt) {
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        if (p.life <= 0 || p.x < -40 || p.x > W + 40 || p.y < -40 || p.y > H + 40) {
          projectiles.splice(i, 1);
          continue;
        }
        if (Math.hypot(player.x - p.x, player.y - p.y) < player.r + p.r) {
          damagePlayer(p.damage, p.x, p.y);
          addSpark(p.x, p.y, p.color, 8);
          projectiles.splice(i, 1);
        }
      }
    }

    function updatePickups(dt) {
      for (let i = pickups.length - 1; i >= 0; i--) {
        const p = pickups[i];
        p.age += dt;
        const dx = player.x - p.x;
        const dy = player.y - p.y;
        const d = Math.hypot(dx, dy) || 1;
        if (d < 74) {
          p.x += (dx / d) * 210 * dt;
          p.y += (dy / d) * 210 * dt;
        }
        if (d < player.r + p.r + 3) {
          if (p.kind === 'heal') {
            player.hp = Math.min(player.maxHp, player.hp + 4);
            addParticle(p.x, p.y, '+4', { color: '#8ff0a4' });
          }
          if (p.kind === 'energy') {
            const amount = 28 + state.wave * 4;
            gainEnergy(amount);
            state.score += 12;
          }
          if (p.kind === 'relic') applyRelic(p.relic);
          pickups.splice(i, 1);
          continue;
        }
        if (p.age > 18) pickups.splice(i, 1);
      }
    }

    function updateEffects(dt) {
      state.shake = Math.max(0, state.shake - dt * 22);
      state.messageTimer = Math.max(0, state.messageTimer - dt);

      for (let i = slashes.length - 1; i >= 0; i--) {
        slashes[i].life -= dt;
        if (slashes[i].life <= 0) slashes.splice(i, 1);
      }
      for (let i = skillWaves.length - 1; i >= 0; i--) {
        const wv = skillWaves[i];
        wv.life -= dt;
        const t = 1 - wv.life / wv.maxLife;
        wv.r = wv.maxR * Math.sin(t * Math.PI * 0.5);
        if (wv.life <= 0) skillWaves.splice(i, 1);
      }
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.t -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 80 * dt;
        if (p.t <= 0) particles.splice(i, 1);
      }
    }

    function update(dt) {
      const input = getInput();
      if (!state.running) {
        if (input.startEdge) resetGame();
        updateEffects(dt);
        return;
      }

      if (state.hitStop > 0) {
        state.hitStop = Math.max(0, state.hitStop - dt);
        updateEffects(dt * 0.35);
        return;
      }

      state.time += dt;
      updatePlayer(dt, input);
      updateSpawning(dt);
      updateEnemies(dt);
      updateProjectiles(dt);
      updatePickups(dt);
      updateEffects(dt);
    }

    function drawBackground() {
      const g = ctx.createLinearGradient(0, 0, W, H);
      g.addColorStop(0, '#10261f');
      g.addColorStop(0.48, '#091310');
      g.addColorStop(1, '#181509');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      ctx.strokeStyle = '#29534255';
      ctx.lineWidth = 1;
      for (let x = -W; x < W * 2; x += 56) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x + W * 0.62, H);
        ctx.stroke();
      }
      for (let x = -W; x < W * 2; x += 56) {
        ctx.beginPath();
        ctx.moveTo(x, H);
        ctx.lineTo(x + W * 0.62, 0);
        ctx.stroke();
      }

      for (const s of scenery) {
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.fillStyle = s.kind === 'stone' ? '#2b352f' : '#263a29';
        ctx.strokeStyle = s.kind === 'stone' ? '#526156' : '#486a3d';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(0, 8, s.w, s.h, 0, 0, TAU);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#0005';
        ctx.beginPath();
        ctx.ellipse(8, 16, s.w * 0.8, s.h * 0.42, 0, 0, TAU);
        ctx.fill();
        ctx.restore();
      }
    }

    function drawShadow(x, y, w, h, alpha = 0.35) {
      ctx.fillStyle = `rgba(0, 0, 0, ${alpha})`;
      ctx.beginPath();
      ctx.ellipse(x, y + h * 0.55, w, h, 0, 0, TAU);
      ctx.fill();
    }

    function drawPlayer() {
      const blink = player.invuln > 0 && Math.floor(player.invuln * 22) % 2 === 0;
      drawShadow(player.x, player.y, 18, 8, 0.38);
      if (blink) return;

      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.facing);

      ctx.strokeStyle = '#d9f7ff';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#9defff';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(7, -3);
      ctx.lineTo(30, -5);
      ctx.stroke();
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#15171a';
      ctx.beginPath();
      ctx.ellipse(-2, 0, 12, 9, 0, 0, TAU);
      ctx.fill();

      ctx.fillStyle = '#5fc8f2';
      ctx.beginPath();
      ctx.ellipse(2, -7, 12, 9, 0, 0, TAU);
      ctx.fill();

      ctx.fillStyle = '#f0bf61';
      ctx.beginPath();
      ctx.arc(12, -5, 2.4, 0, TAU);
      ctx.fill();
      ctx.restore();
    }

    function drawEnemy(e) {
      drawShadow(e.x, e.y, e.r * 1.05, e.r * 0.42, e.boss ? 0.48 : 0.34);
      ctx.save();
      ctx.translate(e.x, e.y);
      const flash = e.flash > 0;
      ctx.fillStyle = flash ? '#ffffff' : e.color;
      ctx.strokeStyle = e.boss ? '#fff0b4' : '#ffffff33';
      ctx.lineWidth = e.boss ? 2 : 1;

      if (e.type === 'skitter') {
        ctx.beginPath();
        ctx.moveTo(e.r, 0);
        ctx.lineTo(-e.r * 0.7, -e.r * 0.75);
        ctx.lineTo(-e.r * 0.45, e.r * 0.8);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } else if (e.type === 'wisp') {
        ctx.shadowColor = e.color;
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.moveTo(0, -e.r);
        ctx.lineTo(e.r, 0);
        ctx.lineTo(0, e.r);
        ctx.lineTo(-e.r, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.shadowBlur = 0;
      } else if (e.type === 'warden') {
        ctx.beginPath();
        ctx.ellipse(0, 0, e.r * 0.9, e.r * 1.1, 0, 0, TAU);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#433814';
        ctx.fillRect(-e.r * 0.5, -4, e.r, 8);
      } else {
        ctx.beginPath();
        ctx.roundRect(-e.r, -e.r * 0.75, e.r * 2, e.r * 1.5, 5);
        ctx.fill();
        ctx.stroke();
        if (e.windup > 0) {
          ctx.strokeStyle = '#ffefd2';
          ctx.beginPath();
          ctx.arc(0, 0, e.r + 5, 0, TAU * (1 - e.windup / 0.5));
          ctx.stroke();
        }
      }
      ctx.restore();

      const w = e.boss ? 72 : e.r * 2.2;
      const h = e.boss ? 6 : 4;
      const y = e.y - e.r - 12;
      ctx.fillStyle = '#050807';
      ctx.fillRect(e.x - w / 2, y, w, h);
      ctx.fillStyle = e.boss ? '#f6d57a' : '#87f0a1';
      ctx.fillRect(e.x - w / 2, y, w * Math.max(0, e.hp / e.maxHp), h);
    }

    function drawPickup(p) {
      const bob = Math.sin(state.time * 5 + p.pulse) * 3;
      ctx.save();
      ctx.translate(p.x, p.y + bob);
      if (p.kind === 'heal') {
        ctx.fillStyle = '#8ff0a4';
        ctx.beginPath();
        ctx.arc(0, 0, p.r, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#18351f';
        ctx.fillRect(-2, -6, 4, 12);
        ctx.fillRect(-6, -2, 12, 4);
      }
      if (p.kind === 'energy') {
        ctx.fillStyle = '#76e7d2';
        ctx.shadowColor = '#76e7d2';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(0, -p.r);
        ctx.lineTo(p.r * 0.85, 0);
        ctx.lineTo(0, p.r);
        ctx.lineTo(-p.r * 0.85, 0);
        ctx.closePath();
        ctx.fill();
      }
      if (p.kind === 'relic') {
        ctx.fillStyle = '#f0bf61';
        ctx.shadowColor = '#f0bf61';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.roundRect(-p.r, -p.r, p.r * 2, p.r * 2, 4);
        ctx.fill();
        ctx.fillStyle = '#402c0c';
        ctx.fillRect(-2, -6, 4, 12);
      }
      ctx.restore();
      ctx.shadowBlur = 0;
    }

    function drawProjectile(p) {
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, TAU);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function drawSlash(s) {
      const alpha = Math.max(0, s.life / s.maxLife);
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.dir);
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = s.combo === 3 ? '#f6d57a' : '#baf7ed';
      ctx.lineWidth = s.combo === 3 ? 8 : 5;
      ctx.shadowColor = ctx.strokeStyle;
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(0, 0, s.range, -s.arc, s.arc);
      ctx.stroke();
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(s.range, 0);
      ctx.stroke();
      ctx.restore();
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    }

    function drawSkillWave(wv) {
      const a = Math.max(0, wv.life / wv.maxLife);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.strokeStyle = '#76e7d2';
      ctx.lineWidth = 8 * a + 1;
      ctx.shadowColor = '#76e7d2';
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.arc(wv.x, wv.y, wv.r, 0, TAU);
      ctx.stroke();
      ctx.restore();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }

    function drawParticles() {
      ctx.save();
      for (const p of particles) {
        const a = clamp(p.t / p.maxT, 0, 1);
        ctx.globalAlpha = a;
        ctx.fillStyle = p.color;
        if (p.dot) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * a, 0, TAU);
          ctx.fill();
        } else {
          ctx.font = `${p.size}px Consolas, "Meiryo", sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillText(p.text, p.x, p.y);
        }
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    function drawBars() {
      const x = 18;
      const y = 18;
      const hpW = 180;
      ctx.fillStyle = '#060908';
      ctx.fillRect(x, y, hpW, 12);
      ctx.fillStyle = '#ef6b66';
      ctx.fillRect(x, y, hpW * (player.hp / player.maxHp), 12);
      ctx.strokeStyle = '#e8f4ed88';
      ctx.strokeRect(x, y, hpW, 12);

      ctx.fillStyle = '#060908';
      ctx.fillRect(x, y + 18, hpW, 7);
      ctx.fillStyle = '#76e7d2';
      ctx.fillRect(x, y + 18, hpW * (player.energy / player.nextEnergy), 7);

      ctx.fillStyle = '#060908';
      ctx.fillRect(x, y + 31, hpW, 6);
      ctx.fillStyle = '#f0bf61';
      ctx.fillRect(x, y + 31, hpW * (1 - player.skillCd / player.skillMax), 6);

      ctx.fillStyle = '#e8f4ed';
      ctx.font = '12px Consolas, monospace';
      ctx.fillText(`Lv ${player.level}`, x + hpW + 12, y + 11);
    }

    function drawMessage() {
      if (state.messageTimer <= 0) return;
      ctx.save();
      ctx.globalAlpha = clamp(state.messageTimer / 0.35, 0, 1);
      ctx.fillStyle = '#07110fcc';
      ctx.fillRect(170, H - 52, W - 340, 28);
      ctx.strokeStyle = '#76e7d288';
      ctx.strokeRect(170, H - 52, W - 340, 28);
      ctx.fillStyle = '#e8f4ed';
      ctx.font = '13px "Meiryo", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(state.message, W / 2, H - 33);
      ctx.restore();
    }

    function drawGameOver() {
      if (state.running) return;
      ctx.save();
      ctx.fillStyle = '#000b';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fff2e8';
      ctx.font = '38px "Segoe UI", "Meiryo", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', W / 2, H / 2 - 12);
      ctx.font = '14px Consolas, monospace';
      ctx.fillText('Enter / R / Start', W / 2, H / 2 + 24);
      ctx.restore();
    }

    function draw() {
      ctx.save();
      if (state.shake > 0) {
        ctx.translate(rand(-state.shake, state.shake), rand(-state.shake, state.shake));
      }

      drawBackground();
      for (const p of projectiles) drawProjectile(p);
      for (const p of pickups) drawPickup(p);
      for (const wv of skillWaves) drawSkillWave(wv);
      for (const s of slashes) drawSlash(s);

      const actors = [
        ...enemies.map(e => ({ y: e.y, draw: () => drawEnemy(e) })),
        { y: player.y, draw: drawPlayer }
      ].sort((a, b) => a.y - b.y);
      for (const a of actors) a.draw();

      drawParticles();
      drawBars();
      drawMessage();
      drawGameOver();
      ctx.restore();

      statsEl.textContent =
        `HP ${player.hp}/${player.maxHp} | Lv ${player.level} | Pow ${player.power} | Speed ${Math.round(player.speed)} | Score ${state.score} | Wave ${state.wave} | Enemies ${enemies.length}`;
    }

    function updateBuildPanel() {
      if (player.relics.length === 0) {
        buildEl.innerHTML = '<div class="empty">まだ何も拾っていない。敵を倒すと、まれにレリックが落ちます。</div>';
        return;
      }
      const recent = player.relics.slice(-8).reverse();
      buildEl.innerHTML = recent.map(relic => (
        `<div class="relic"><strong>${relic.name}</strong><br>${relic.desc}</div>`
      )).join('');
    }

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    function resizeCanvas() {
      const maxW = Math.min(960, window.innerWidth - 40);
      canvas.style.maxWidth = `${Math.max(320, maxW)}px`;
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('keydown', (e) => {
      const k = keyName(e.key);
      keys.add(k);
      keyHeld[k] = true;
      if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
    });
    window.addEventListener('keyup', (e) => {
      const k = keyName(e.key);
      keys.delete(k);
      keyHeld[k] = false;
    });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = (e.clientX - rect.left) * (W / rect.width);
      mouse.y = (e.clientY - rect.top) * (H / rect.height);
      mouse.inside = true;
    });
    canvas.addEventListener('mouseleave', () => {
      mouse.inside = false;
    });
    canvas.addEventListener('mousedown', (e) => {
      if (e.button === 0) queued.attack = true;
      if (e.button === 2) queued.skill = true;
      e.preventDefault();
    });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    window.addEventListener('gamepadconnected', (event) => {
      activeGamepad = event.gamepad.index;
      padEl.textContent = `Gamepad connected: ${event.gamepad.id}`;
    });
    window.addEventListener('gamepaddisconnected', (event) => {
      if (activeGamepad === event.gamepad.index) activeGamepad = null;
      padEl.textContent = 'Gamepad: disconnected';
    });

    resizeCanvas();
    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
